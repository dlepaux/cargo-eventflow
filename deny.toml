# cargo-deny config — runs in CI via `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # Banned per synthesis §P0-D:
    # - figment: hand-rolled validator is ~50 lines
    # - miette: ~500 KB; defer to v0.2 if user feedback demands
    { name = "figment" },
    { name = "miette" },
    # Banned from lib.rs but allowed in main.rs:
    # - anyhow: enforce via code review, not deny config, since
    #   it must be available for the bin target.
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
