name: CI

# Thin caller for the rust-crate reusable workflow.
# All CI logic lives in dlepaux/github-workflows.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Caller must declare permissions the reusable needs — default token is
# read-only and a reusable cannot elevate above the caller's grant.
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: dlepaux/github-workflows/.github/workflows/rust-crate.yml@v1
    with:
      crate_name: cargo-eventflow
      coverage_floor: 50
      is_cli_tool: true
    secrets:
      KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
